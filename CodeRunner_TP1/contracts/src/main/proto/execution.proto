syntax = "proto3";

package isel.cd.coderunner.execution;
option java_multiple_files = true;
option java_package = "isel.cd.coderunner.execution";

enum ExecutionStatus {
  UNKNOWN = 0;
  PENDENTE = 1;
  CONCLUIDO = 2;
  TIMEOUT = 3;
  ERRO = 4;
}

service ExecutionService {
  // c: Submeter programa via streaming de cliente
  rpc SubmitProgram (stream ProgramChunk) returns (SubmitResponse);

  // c: Obter resultado via streaming de servidor
  rpc GetResult (ResultRequest) returns (stream ResultChunk);
}

message ProgramChunk {
  oneof data {
    SubmitMetadata metadata = 1;
    bytes prog_content = 2;
    bytes input_content = 3;
  }
}

message SubmitMetadata {
  string filename = 1;
  bool has_input = 2;
}

message SubmitResponse {
  string request_id = 1;
}

message ResultRequest {
  string request_id = 1;
}

message ResultChunk {
  ExecutionStatus status = 1;
  int32 exit_code = 2;
  string execution_server = 3; // IP:Porto do RunServer responsável
  oneof payload {
    bytes stdout_chunk = 4;
    bytes stderr_chunk = 5;
  }
}